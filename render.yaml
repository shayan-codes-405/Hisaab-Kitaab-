services:
  - type: web
    name: hisabkitab-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: DATABASE_NAME
        value: hisabkitab_db
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: TEXTBEE_API_URL
        value: https://api.textbee.dev/api/v1
      - key: TEXTBEE_API_KEY
        sync: false
      - key: TEXTBEE_DEVICE_ID
        sync: false
      - key: TEXTBEE_DEMO_MODE
        value: "false"

